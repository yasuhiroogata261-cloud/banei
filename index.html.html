<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ばんえい競馬 出走表 2026/5/23</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Antique+Soft&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f0e8;
    --surface: #ede6d8;
    --surface2: #e0d8c8;
    --border: #c8b898;
    --accent: #c8882a;
    --accent2: #e8b040;
    --accent3: #8b5e1a;
    --text: #1a1208;
    --text2: #6b5535;
    --text3: #a08860;
    --highlight: rgba(200,136,42,0.15);
    --mark-hon: #e84040;
    --mark-tai: #4a8fc8;
    --mark-san: #5ab870;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 16px;
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    background: linear-gradient(135deg, #2a1a08 0%, #3d2510 50%, #2a1a08 100%);
    border-bottom: 2px solid var(--accent3);
    padding: 18px 20px 14px;
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .header-left { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }

  .site-title {
    font-family: 'Zen Antique Soft', serif;
    font-size: clamp(18px, 4vw, 26px);
    color: var(--accent2);
    letter-spacing: 0.06em;
    text-shadow: 0 0 20px rgba(232,176,64,0.4);
    white-space: nowrap;
  }

  .date-badge {
    background: var(--accent3);
    color: var(--accent2);
    font-size: 13px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 2px;
    letter-spacing: 0.08em;
    white-space: nowrap;
  }

  .race-count {
    color: var(--text2);
    font-size: 12px;
    white-space: nowrap;
  }

  /* ── Race Tabs ── */
  .race-nav {
    background: #ede6d8;
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--accent3) transparent;
  }

  .race-nav::-webkit-scrollbar { height: 3px; }
  .race-nav::-webkit-scrollbar-track { background: transparent; }
  .race-nav::-webkit-scrollbar-thumb { background: var(--accent3); }

  .tab-time {
    font-size: 10px;
    font-weight: 400;
    opacity: 0.8;
    letter-spacing: 0;
  }

  .tab-btn {
    background: #d8ceba;
    border: 1px solid var(--border);
    color: var(--text2);
    padding: 7px 14px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.18s;
    white-space: nowrap;
    font-family: 'Noto Sans JP', sans-serif;
    flex-shrink: 0;
  }

  .tab-btn:hover {
    border-color: var(--accent);
    color: var(--accent2);
    background: var(--highlight);
  }

  .tab-btn.active {
    background: var(--accent);
    border-color: var(--accent2);
    color: #1a0e00;
    font-weight: 700;
    box-shadow: 0 0 12px rgba(200,136,42,0.5);
  }

  /* ── Main Content ── */
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 24px 16px 48px;
  }

  .race-panel { display: none; }
  .race-panel.active { display: block; }

  /* ── Race Header ── */
  .race-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 16px;
    gap: 12px;
    flex-wrap: wrap;
  }

  .race-title-group { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }

  .race-number {
    font-family: 'Zen Antique Soft', serif;
    font-size: 32px;
    color: var(--accent2);
    line-height: 1;
    text-shadow: 0 0 16px rgba(232,176,64,0.35);
  }

  .race-label {
    font-size: 15px;
    color: var(--text);
    font-weight: 500;
    letter-spacing: 0.04em;
  }

  .race-class-badge {
    background: #d8ceba;
    border: 1px solid var(--accent3);
    color: var(--accent);
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 2px;
    font-weight: 500;
    letter-spacing: 0.05em;
  }

  .horse-count {
    color: var(--text2);
    font-size: 12px;
    padding-top: 4px;
  }

  /* ── Table ── */
  .entry-table {
    width: 100%;
    border-collapse: collapse;
    border: 1px solid var(--border);
  }

  .entry-table thead th {
    background: linear-gradient(180deg, #3a2810 0%, #2a1c08 100%);
    color: var(--accent);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.06em;
    padding: 11px 12px;
    text-align: center;
    border-bottom: 2px solid var(--accent3);
    border-right: 1px solid var(--border);
    white-space: nowrap;
  }

  .entry-table thead th:last-child { border-right: none; }

  .entry-table tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.14s;
  }

  .entry-table tbody tr:hover { background: var(--highlight); }
  .entry-table tbody tr:last-child { border-bottom: none; }

  .entry-table tbody td {
    padding: 13px 12px;
    text-align: center;
    border-right: 1px solid var(--border);
    vertical-align: middle;
  }

  .entry-table tbody td:last-child { border-right: none; }

  /* Column: number */
  .col-num {
    font-family: 'Zen Antique Soft', serif;
    font-size: 20px;
    color: var(--accent2);
    width: 48px;
    min-width: 48px;
    cursor: pointer;
    user-select: none;
    transition: color 0.15s;
  }
  .col-num:hover { color: var(--mark-hon); }
  .col-num:active { opacity: 0.6; }

  /* Scratched row */
  tr.scratched .col-num { color: var(--text3); text-decoration: line-through; }
  tr.scratched .col-name { color: var(--text3); text-decoration: line-through; opacity: 0.5; }
  tr.scratched .mark-cell { pointer-events: none; opacity: 0.3; }

  /* Column: name */
  .col-name {
    text-align: left !important;
    font-size: 16px;
    font-weight: 500;
    color: #111111;
    letter-spacing: 0.02em;
    padding-left: 14px !important;
  }

  /* ── Predictor name editable ── */
  .predictor-label {
    background: transparent;
    border: none;
    border-bottom: 1px dashed var(--accent3);
    color: var(--accent2);
    font-size: 13px;
    font-weight: 700;
    font-family: 'Noto Sans JP', sans-serif;
    text-align: center;
    width: 52px;
    outline: none;
    letter-spacing: 0.05em;
    cursor: pointer;
  }
  .predictor-label:focus { border-bottom-color: var(--accent2); }

  /* Column: mark cell (tap to cycle) */
  .col-mark { width: 58px; min-width: 50px; }

  .mark-cell {
    cursor: pointer;
    user-select: none;
    font-family: 'Zen Antique Soft', serif;
    font-size: 22px;
    text-align: center;
    transition: background 0.15s;
    padding: 6px 4px !important;
  }
  .mark-cell:hover { background: rgba(255,255,255,0.06); }

  .mark-cell[data-val=""]    { color: var(--text3); }
  .mark-cell[data-val="◎"]  { color: var(--mark-hon); text-shadow: 0 0 8px rgba(232,64,64,0.6); }
  .mark-cell[data-val="○"]  { color: var(--mark-tai); text-shadow: 0 0 8px rgba(74,143,200,0.6); }
  .mark-cell[data-val="△"]  { color: var(--mark-san); text-shadow: 0 0 8px rgba(90,184,112,0.6); }
  .mark-cell[data-val="▲"]  { color: #d4a020; text-shadow: 0 0 8px rgba(212,160,32,0.6); }

  /* Row highlight by predictor 0 mark */
  .entry-table tbody tr.row-hon { background: rgba(232,64,64,0.07) !important; }
  .entry-table tbody tr.row-tai { background: rgba(74,143,200,0.07) !important; }
  .entry-table tbody tr.row-san { background: rgba(90,184,112,0.06) !important; }

  /* Column: score */
  .col-score {
    width: 52px;
    min-width: 48px;
    font-size: 15px;
    font-weight: 700;
    text-align: center;
    border-left: 2px solid var(--accent3) !important;
  }

  .score-val {
    display: inline-block;
    min-width: 28px;
    padding: 2px 5px;
    border-radius: 4px;
    font-variant-numeric: tabular-nums;
  }

  .score-0    { color: var(--text3); }
  .score-1st  { color: var(--mark-hon); font-weight: 800; font-size: 17px; }
  .score-2nd  { color: #c84040; font-weight: 700; }
  .score-3rd  { color: #e06050; font-weight: 600; }
  .score-lo   { color: #6b5535; }

  /* Column separator between predictor sets */
  .col-sep { border-left: 2px solid var(--accent3) !important; }

  /* Row stripe for alternate */
  .entry-table tbody tr:nth-child(even) { background: rgba(0,0,0,0.03); }
  .entry-table tbody tr:hover { background: var(--highlight); }

  /* ── Footer ── */
  footer {
    border-top: 1px solid var(--border);
    padding: 14px 20px;
    text-align: center;
    color: var(--text3);
    font-size: 11px;
  }

  /* ── Responsive ── */
  @media (max-width: 600px) {
    .entry-table tbody td { padding: 8px 4px; }
    .entry-table thead th { padding: 7px 4px; }
    .col-mark { width: 46px; min-width: 42px; }
    .mark-cell { font-size: 18px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <span class="site-title">ばんえい競馬</span>
    <span class="date-badge">2026年5月23日（土）</span>
  </div>
  <span class="race-count">全12レース</span>
</header>

<nav class="race-nav" id="raceNav">
  <!-- Tabs injected by JS -->
</nav>

<main id="mainContent">
  <!-- Panels injected by JS -->
</main>

<footer>
  データ出典：ばんえい十勝公式（banei-keiba.or.jp）　※出走予定馬は変更になる場合があります
</footer>

<script>
const races = [
  { race:1, class:"340万円未満", entries:[
    {name:"イワキライジン"}, {name:"ハートキング"}, {name:"スーパーハリアー"},
    {name:"レオナウイン"}, {name:"マスタークィン"}, {name:"コトブキクィーン"},
    {name:"スターメジャー"}, {name:"ジェイフラック"}, {name:"ミサキビクトリー"}
  ]},
  { race:2, class:"220万円未満", entries:[
    {name:"サクラキンショウ"}, {name:"ツガルノキンヒメ"}, {name:"ジュンクン"},
    {name:"ハゴロモグレース"}, {name:"ハゴロモコスモス"}, {name:"サクラセイリュウ"},
    {name:"ジェイノウンカイ"}, {name:"クニキヨシシオウ"}, {name:"ビックストーン"}
  ]},
  { race:3, class:"220万円未満", entries:[
    {name:"ツガルキンフジ"}, {name:"カナデ"}, {name:"クリスタルジェンド"},
    {name:"スーパーサンセイ"}, {name:"ゴールドダイ"}, {name:"サクセスオーショウ"},
    {name:"フェアリーマーチ"}, {name:"ホクセイミドリコ"}, {name:"マルホンカオン"}
  ]},
  { race:4, class:"220万円未満", entries:[
    {name:"ヤマツネライン"}, {name:"ユウマックス"}, {name:"ヒメトラユリア"},
    {name:"ヴィクトワールラン"}, {name:"フジベンケイ"}, {name:"カネノキセキ"},
    {name:"テツオ"}, {name:"サカノテイオー"}
  ]},
  { race:5, class:"340万円未満", entries:[
    {name:"インカン"}, {name:"ジェイノミキ"}, {name:"ホクセイダイジン"},
    {name:"エレジー"}, {name:"マルホンポナ"}, {name:"スズカゼ"},
    {name:"アアモンドラヴリー"}, {name:"ビエイニトドケ"}, {name:"キタサカエヒメコ"}
  ]},
  { race:6, class:"430万円未満", entries:[
    {name:"サカノキンザン"}, {name:"ナカサンブライアン"}, {name:"ジェイメジャー"},
    {name:"ジェイマーサ"}, {name:"ベルンシュタイン"}, {name:"ホクショウゴールド"},
    {name:"ヒカリファイヤー"}, {name:"イワキオーカン"}, {name:"ゴールドキング"}
  ]},
  { race:7, class:"430万円未満", entries:[
    {name:"アオタイショウ"}, {name:"クリスタルスノー"}, {name:"ドウナンカツユウホ"},
    {name:"ニジイロアオゾラ"}, {name:"ハクホウエイ"}, {name:"ホクセイビックボス"},
    {name:"ヤマノトップ"}, {name:"ヨシノヒーロー"}, {name:"リアステンリュウ"}
  ]},
  { race:8, class:"550万円未満", entries:[
    {name:"マルホンジュセ"}, {name:"ヤマノドラゴン"}, {name:"ケンチャン"},
    {name:"プラチナガール"}, {name:"アカネリュウ"}, {name:"ツルイテンカ"},
    {name:"クロカゲパワー"}, {name:"アルジャンノオー"}, {name:"バンクフェーブル"}
  ]},
  { race:9, class:"550万円未満", entries:[
    {name:"ビッグシラヌイ"}, {name:"トカチヒロ"}, {name:"ミナミジュウジセイ"},
    {name:"ジェイスカイ"}, {name:"ハゴロモグルービー"}, {name:"カワノデッカー"},
    {name:"オーディン"}, {name:"ホクショウハヤテ"}, {name:"ホクセイサクラオー"}
  ]},
  { race:10, class:"670万円未満", entries:[
    {name:"オオゾラタカラ"}, {name:"レジェンドボス"}, {name:"コトブキテンザン"},
    {name:"テッチャン"}, {name:"レッドウンカイ"}, {name:"ビックボス"},
    {name:"イワキブラボー"}, {name:"グリフィス"}
  ]},
  { race:11, class:"1000万円未満混合", entries:[
    {name:"ウチュウジン"}, {name:"マルホンリョウダイ"}, {name:"サカノテンリュウ"},
    {name:"アアモンドキーマン"}, {name:"ジェイヒーロー"}, {name:"ホクセイタイヨウ"},
    {name:"レイリーキング"}, {name:"ジェイホースワン"}, {name:"コブダイヤ"}, {name:"シルバーアロイ"}
  ]},
  { race:12, class:"670万円未満", entries:[
    {name:"ツカサセンター"}, {name:"コーワホープ"}, {name:"イナノホマレ"},
    {name:"ダイヤセンプー"}, {name:"タイタス"}, {name:"ホクショウムサシ"},
    {name:"ディーホワイト"}, {name:"ツカサタロウ"}, {name:"フクノエル"}, {name:"クリスタルホーク"}
  ]}
];

const startTimes = ['14:30', '15:05', '15:40', '16:15', '16:50', '17:25', '17:55', '18:25', '18:55', '19:30', '20:00', '20:30'];
const NUM_PREDICTORS = 3;
const predictorNames = ['リッキー', '福来', 'KCK'];
const CYCLE = ['', '◎', '○', '▲', '△'];

// marks[predictor][raceIndex][horseIndex] = '' | '◎' | '○' | '▲' | '△'
const marks = Array.from({ length: NUM_PREDICTORS }, () =>
  races.map(r => r.entries.map(() => ''))
);

const SCORE_MAP = { '◎': 8, '○': 4, '▲': 2, '△': 1, '': 0 };

function calcScore(raceIdx, horseIdx) {
  let total = 0;
  for (let p = 0; p < NUM_PREDICTORS; p++) {
    total += SCORE_MAP[marks[p][raceIdx][horseIdx]] || 0;
  }
  return total;
}

function updateScore(raceIdx, horseIdx) {
  const scoreEl = document.querySelector(`#panel-${raceIdx} tbody tr[data-horse="${horseIdx}"] .score-val`);
  if (!scoreEl) return;
  const s = calcScore(raceIdx, horseIdx);
  scoreEl.textContent = s > 0 ? s : '';
  scoreEl.className = 'score-val score-0';
  updateAllRanks(raceIdx);
}

function updateAllRanks(raceIdx) {
  const race = races[raceIdx];
  // Collect scores for all horses
  const scored = race.entries.map((_, hIdx) => ({ hIdx, score: calcScore(raceIdx, hIdx) }))
    .filter(x => x.score > 0)
    .sort((a, b) => b.score - a.score);

  // Assign ranks strictly (ties push everyone down)
  // e.g. two horses tied at 1st => both are 1st, next is 3rd
  race.entries.forEach((_, hIdx) => {
    const scoreEl = document.querySelector(`#panel-${raceIdx} tbody tr[data-horse="${hIdx}"] .score-val`);
    if (!scoreEl) return;
    const s = calcScore(raceIdx, hIdx);
    scoreEl.textContent = s > 0 ? s : '';
    if (s === 0) { scoreEl.className = 'score-val score-0'; return; }
    // Count how many horses scored strictly higher
    const rank = scored.filter(x => x.score > s).length + 1;
    scoreEl.className = 'score-val ' + (rank === 1 ? 'score-1st' : rank === 2 ? 'score-2nd' : rank === 3 ? 'score-3rd' : 'score-lo');
  });
}

function scratchHorse(numCell, raceIdx, horseIdx) {
  const row = numCell.closest('tr');
  const isScratched = row.classList.toggle('scratched');
  if (isScratched) {
    for (let p = 0; p < NUM_PREDICTORS; p++) {
      marks[p][raceIdx][horseIdx] = '';
    }
    row.querySelectorAll('.mark-cell').forEach(c => {
      c.dataset.val = '';
      c.textContent = '';
    });
    updateScore(raceIdx, horseIdx);
  }
  saveData();
}

function cycleMark(cell, pIdx, raceIdx, horseIdx) {
  const cur = marks[pIdx][raceIdx][horseIdx];
  const next = CYCLE[(CYCLE.indexOf(cur) + 1) % CYCLE.length];
  marks[pIdx][raceIdx][horseIdx] = next;
  cell.dataset.val = next;
  cell.textContent = next;
  updateScore(raceIdx, horseIdx);
  saveData();
}

// ── Export / Import ──────────────────────────────────
function saveData() {
  const data = { marks, scratched: [] };
  document.querySelectorAll('tr.scratched[data-horse]').forEach(row => {
    const panel = row.closest('.race-panel');
    if (!panel) return;
    data.scratched.push({
      rIdx: parseInt(panel.id.replace('panel-','')),
      hIdx: parseInt(row.dataset.horse)
    });
  });
  try { localStorage.setItem('banei_2026_5_4', JSON.stringify(data)); } catch(e) {}
}

function collectData() {
  const data = { marks, scratched: [] };
  document.querySelectorAll('tr.scratched[data-horse]').forEach(row => {
    const panel = row.closest('.race-panel');
    if (!panel) return;
    const rIdx = parseInt(panel.id.replace('panel-', ''));
    const hIdx = parseInt(row.dataset.horse);
    data.scratched.push({ rIdx, hIdx });
  });
  return data;
}

function exportData() {
  const json = JSON.stringify(collectData());
  const encoded = btoa(encodeURIComponent(json));
  // Show modal with the code
  showModal('📋 予想データをコピーして保存してください', encoded, false);
}

function importData() {
  showModal('📥 保存したコードを貼り付けてください', '', true);
}

function applyData(raw) {
  try {
    const json = decodeURIComponent(atob(raw.trim()));
    const data = JSON.parse(json);
    if (data.marks) {
      data.marks.forEach((pMarks, p) => {
        pMarks.forEach((rMarks, r) => {
          rMarks.forEach((val, h) => {
            if (marks[p] && marks[p][r] !== undefined) marks[p][r][h] = val;
          });
        });
      });
    }
    // Clear existing scratched
    document.querySelectorAll('tr.scratched').forEach(r => r.classList.remove('scratched'));
    if (data.scratched) {
      data.scratched.forEach(({ rIdx, hIdx }) => {
        const row = document.querySelector(`#panel-${rIdx} tbody tr[data-horse="${hIdx}"]`);
        if (row) row.classList.add('scratched');
      });
    }
    races.forEach((r, rIdx) => {
      r.entries.forEach((_, hIdx) => {
        for (let p = 0; p < NUM_PREDICTORS; p++) {
          const cell = document.querySelector(`#panel-${rIdx} tbody tr[data-horse="${hIdx}"] .mark-cell[data-p="${p}"]`);
          if (cell) { cell.dataset.val = marks[p][rIdx][hIdx]; cell.textContent = marks[p][rIdx][hIdx]; }
        }
        updateScore(rIdx, hIdx);
      });
      updateAllRanks(rIdx);
    });
    closeModal();
    showToast('✅ 読み込みました！');
  } catch(e) {
    showToast('❌ コードが正しくありません');
  }
}

function loadData() {
  try {
    const raw = localStorage.getItem('banei_2026_5_4');
    if (!raw) return;
    const data = JSON.parse(raw);
    if (data.marks) {
      data.marks.forEach((pMarks, p) => {
        pMarks.forEach((rMarks, r) => {
          rMarks.forEach((val, h) => {
            if (marks[p] && marks[p][r] !== undefined) marks[p][r][h] = val;
          });
        });
      });
    }
    if (data.scratched) {
      data.scratched.forEach(({ rIdx, hIdx }) => {
        const row = document.querySelector(`#panel-${rIdx} tbody tr[data-horse="${hIdx}"]`);
        if (row) row.classList.add('scratched');
      });
    }
    races.forEach((r, rIdx) => {
      r.entries.forEach((_, hIdx) => {
        for (let p = 0; p < NUM_PREDICTORS; p++) {
          const cell = document.querySelector(`#panel-${rIdx} tbody tr[data-horse="${hIdx}"] .mark-cell[data-p="${p}"]`);
          if (cell) { cell.dataset.val = marks[p][rIdx][hIdx]; cell.textContent = marks[p][rIdx][hIdx]; }
        }
        updateScore(rIdx, hIdx);
      });
      updateAllRanks(rIdx);
    });
  } catch(e) {}
}

function clearData() {
  if (!confirm('全レースの予想データをリセットしますか？')) return;
  location.reload();
}

// ── Modal ──────────────────────────────────────────
function showModal(title, value, isInput) {
  document.getElementById('modalTitle').textContent = title;
  const ta = document.getElementById('modalTextarea');
  ta.value = value;
  ta.readOnly = !isInput;
  document.getElementById('modalCopyBtn').style.display = isInput ? 'none' : 'inline-block';
  document.getElementById('modalLoadBtn').style.display = isInput ? 'inline-block' : 'none';
  document.getElementById('dataModal').style.display = 'flex';
  if (!isInput) setTimeout(() => { ta.select(); }, 100);
}

function closeModal() {
  document.getElementById('dataModal').style.display = 'none';
}

function copyModalText() {
  const ta = document.getElementById('modalTextarea');
  ta.select();
  document.execCommand('copy');
  showToast('📋 コピーしました！');
}

function loadFromModal() {
  applyData(document.getElementById('modalTextarea').value);
}

function showToast(msg) {
  const t = document.getElementById('saveToast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2000);
}

function buildApp() {
  const nav = document.getElementById("raceNav");
  const main = document.getElementById("mainContent");

  races.forEach((r, i) => {
    const btn = document.createElement("button");
    btn.className = "tab-btn" + (i === 0 ? " active" : "");
    btn.innerHTML = `<span>${r.race}R</span><br><span class="tab-time">${startTimes[i]}</span>`;
    btn.dataset.index = i;
    btn.addEventListener("click", () => switchRace(i));
    nav.appendChild(btn);

    const panel = document.createElement("div");
    panel.className = "race-panel" + (i === 0 ? " active" : "");
    panel.id = `panel-${i}`;

    const rows = r.entries.map((e, idx) => {
      const cells = Array.from({ length: NUM_PREDICTORS }, (_, p) =>
        `<td class="col-mark mark-cell${p === 0 ? ' col-sep' : ''}" data-val="" data-p="${p}" data-race="${i}" data-horse="${idx}" onclick="cycleMark(this,${p},${i},${idx})"></td>`
      ).join('');
      return `<tr data-horse="${idx}">
        <td class="col-num" onclick="scratchHorse(this,${i},${idx})" title="タップで取消/復活">${idx + 1}</td>
        <td class="col-name">${e.name}</td>
        ${cells}
        <td class="col-score"><span class="score-val score-0"></span></td>
      </tr>`;
    }).join('');

    const headerCells = Array.from({ length: NUM_PREDICTORS }, (_, p) => `
      <th class="col-mark${p === 0 ? ' col-sep' : ''}">
        <input class="predictor-label" value="${predictorNames[p]}" data-p="${p}"
          onchange="predictorNames[this.dataset.p]=this.value" />
      </th>`).join('');

    panel.innerHTML = `
      <table class="entry-table">
        <thead>
          <tr>
            <th>馬番</th>
            <th style="text-align:left;padding-left:14px">馬　名</th>
            ${headerCells}
            <th class="col-score">点数</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    `;

    main.appendChild(panel);
  });

}

function switchRace(index) {
  document.querySelectorAll(".tab-btn").forEach((b, i) => {
    b.classList.toggle("active", i === index);
  });
  document.querySelectorAll(".race-panel").forEach((p, i) => {
    p.classList.toggle("active", i === index);
  });
  // Scroll tab into view
  const tabs = document.querySelectorAll(".tab-btn");
  if (tabs[index]) tabs[index].scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
}

buildApp();
loadData();
</script>

<!-- Toast -->
<div id="saveToast" style="
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
  background:#2a1a08; color:var(--accent2); border:1px solid var(--accent3);
  font-size:13px; padding:8px 20px; border-radius:20px;
  opacity:0; transition:opacity 0.3s; pointer-events:none; z-index:999;
  white-space:nowrap;
"></div>
<style>#saveToast.show { opacity:1; }</style>

<!-- Data Modal -->
<div id="dataModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:1000;align-items:center;justify-content:center;padding:20px;">
  <div style="background:#f5f0e8;border-radius:10px;padding:20px;width:100%;max-width:480px;display:flex;flex-direction:column;gap:12px;">
    <div style="font-size:14px;font-weight:700;color:#2a1a08;" id="modalTitle"></div>
    <textarea id="modalTextarea" style="width:100%;height:120px;border:1px solid #c8b898;border-radius:6px;padding:10px;font-size:12px;font-family:monospace;resize:none;box-sizing:border-box;color:#111;background:#fff;"></textarea>
    <div style="display:flex;gap:8px;justify-content:flex-end;">
      <button onclick="closeModal()" style="background:transparent;border:1px solid #c8b898;border-radius:4px;padding:7px 16px;font-size:13px;cursor:pointer;font-family:'Noto Sans JP',sans-serif;">キャンセル</button>
      <button id="modalCopyBtn" onclick="copyModalText()" style="background:#c8882a;border:none;color:#fff;border-radius:4px;padding:7px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Noto Sans JP',sans-serif;">コピー</button>
      <button id="modalLoadBtn" onclick="loadFromModal()" style="background:#c8882a;border:none;color:#fff;border-radius:4px;padding:7px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Noto Sans JP',sans-serif;">読み込む</button>
    </div>
  </div>
</div>
</body>
</html>
